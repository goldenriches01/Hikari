<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sanggar Hikari</title>
<!-- Favicon Utama -->
<link rel="icon" type="image/png" href="assets/favicon.png" />
<!-- Untuk perangkat Apple / iOS -->
<link rel="apple-touch-icon" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:    #0a0f1a;
      --bg-mid:     #0e1726;
      --gold:       #d4af37;
      --gold-soft:  #f0d98c;
      --gold-glow:  rgba(212, 175, 55, 0.55);
      --text-dim:   #b8b0a0;
      --font-title: 'Cinzel', 'Cormorant Garamond', serif;
      --font-script:'Cormorant Garamond', serif;
      --font-body:  'Montserrat', sans-serif;
    }

    html, body { height: 100%; }

    body {
      font-family: var(--font-body);
      color: var(--gold-soft);
      background: radial-gradient(ellipse at 50% 30%, var(--bg-mid) 0%, var(--bg-deep) 60%, #05080f 100%);
      overflow: hidden;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* ============ BINTANG ============ */
    .bg-decor { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .star {
      position: absolute;
      width: 3px; height: 3px;
      border-radius: 50%;
      background: var(--gold-soft);
      box-shadow: 0 0 8px 2px var(--gold-glow);
      opacity: 0;
      animation: twinkle 4s ease-in-out infinite;
    }
    .star.s1 { top: 18%; left: 22%; animation-delay: .2s; }
    .star.s2 { top: 30%; left: 76%; animation-delay: 1.1s; }
    .star.s3 { top: 68%; left: 15%; animation-delay: 2s; }
    .star.s4 { top: 80%; left: 82%; animation-delay: .6s; }
    .star.s5 { top: 12%; left: 55%; animation-delay: 2.6s; }

    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(.6); }
      50%      { opacity: .9; transform: scale(1.2); }
    }

    /* ============ LAYOUT INTRO ============ */
    .intro {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 0 1.25rem 1.5rem;
      text-align: center;
      overflow: hidden;
    }

    /* ============ LOGO: 3 lapis ============ */
    .logo-pos {
      margin-top: 38vh;
      transition: margin-top 1.15s cubic-bezier(.22, 1, .36, 1);
      flex-shrink: 0;
    }
    .logo-stage {
      width: clamp(150px, 42vw, 250px);
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      transform-origin: center center;
      transition: transform 1.15s cubic-bezier(.22, 1, .36, 1),
                  width 1.15s cubic-bezier(.22, 1, .36, 1),
                  opacity .6s ease;   /* ← tambahan agar fade-out mulus */
      will-change: transform, width, opacity;
    }
    .logo-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      transform-origin: center center;
      will-change: transform, opacity;
      animation: logoReveal 1.6s cubic-bezier(.22, 1, .36, 1) forwards;
    }
    .logo-img {
      width: 100%; height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 18px var(--gold-glow));
    }
    .logo-img.logo-missing { display: none; }
    .logo-fallback {
      display: none;
      font-family: var(--font-script);
      font-size: clamp(2.4rem, 12vw, 4rem);
      color: var(--gold-soft);
      letter-spacing: .08em;
      text-shadow: 0 0 22px var(--gold-glow);
    }
    .logo-img.logo-missing + .logo-fallback { display: block; }

    .logo-glow {
      position: absolute; inset: -12%;
      border-radius: 50%;
      background: radial-gradient(circle, var(--gold-glow) 0%, transparent 68%);
      opacity: 0; filter: blur(18px);
      animation: glowPulse 2s ease-in-out forwards;
      z-index: -1;
      transition: opacity .6s ease;   /* ← pendarnya ikut memudar */
    }

    @keyframes logoReveal {
      0%   { opacity: 0; transform: scale(.82); }
      60%  { opacity: 1; transform: scale(1.04); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes glowPulse {
      0%   { opacity: 0; transform: scale(.8); }
      50%  { opacity: 1; transform: scale(1.08); }
      100% { opacity: .85; transform: scale(1); }
    }

    .intro.stage-two .logo-pos   { margin-top: clamp(2rem, 7vh, 4rem); }
    .intro.stage-two .logo-stage { transform: scale(0.55); width: clamp(80px, 22vw, 130px); }

    /* State transisi keluar: logo & pendarnya memudar bersih */
    .intro.leaving .logo-stage { opacity: 0; }
    .intro.leaving .logo-glow  { opacity: 0 !important; }

    /* ============ SAPAAN & TOMBOL ============ */
    .welcome {
      opacity: 0;
      transform: translateY(14px);
      pointer-events: none;
      transition: opacity .9s ease, transform .9s ease;
      max-width: 540px;
      width: 100%;
      margin-top: 1.2rem;
    }
    .welcome.show { opacity: 1; transform: translateY(0); pointer-events: auto; }

    .eyebrow {
      font-family: var(--font-body);
      font-size: clamp(.58rem, 2.5vw, .7rem);
      letter-spacing: .42em;
      color: var(--gold);
      margin-bottom: .8rem;
      opacity: .85;
    }
    .welcome-title {
      font-family: var(--font-title);
      font-weight: 400;
      font-size: clamp(1.35rem, 5.4vw, 2.2rem);
      line-height: 1.22;
      color: #fff;
      letter-spacing: .02em;
    }
    .welcome-title span {
      font-family: var(--font-script);
      font-size: 1.25em;
      font-style: italic;
      color: var(--gold-soft);
      text-shadow: 0 0 20px var(--gold-glow);
    }
    .welcome-sub {
      font-size: clamp(.75rem, 2.9vw, .9rem);
      font-weight: 300;
      color: var(--text-dim);
      margin: .7rem 0 1.3rem;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: .8rem;
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
    }
    .btn {
      font-family: var(--font-body);
      font-size: clamp(.78rem, 3.1vw, .88rem);
      letter-spacing: .12em;
      padding: .95rem 1.4rem;
      border-radius: 999px;
      border: 1px solid var(--gold);
      cursor: pointer;
      transition: transform .3s ease, box-shadow .3s ease, background .3s ease;
      line-height: 1.2;
    }
    .btn small { display: block; font-size: .62em; opacity: .7; margin-top: .25rem; letter-spacing: .08em; }

    .btn-gold {
      background: linear-gradient(135deg, var(--gold) 0%, #b8912f 100%);
      color: #0a0f1a;
      font-weight: 500;
      box-shadow: 0 4px 14px -6px var(--gold-glow);
    }
    .btn-gold:hover, .btn-gold:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 10px 26px -6px var(--gold-glow);
      outline: none;
    }
    .btn-gold:active { transform: translateY(0); }

    .btn-outline { background: transparent; color: var(--gold-soft); }
    .btn-outline:not(:disabled):hover { background: rgba(212,175,55,.08); }
    .btn-outline:disabled { cursor: not-allowed; opacity: .45; }

    /* ============================================================
       TIRAI — durasi 1s
       ============================================================ */
    .curtains {
      position: fixed; inset: 0; z-index: 50;
      pointer-events: none;
      opacity: 0;
      transition: opacity .3s ease;
    }
    .curtains.active { opacity: 1; }

    .curtain {
      position: absolute; top: 0; bottom: 0; width: 50.5%;
      background: repeating-linear-gradient(90deg, #3a0f1a 0px, #5a1424 18px, #2a0a12 36px, #4a1020 54px);
      box-shadow: inset 0 0 80px rgba(0,0,0,.8);
      transition: transform 1s ease-in-out;
      will-change: transform;
    }
    .curtain-left  { left: 0;  border-right: 2px solid var(--gold); transform: translateX(-100%); }
    .curtain-right { right: 0; border-left: 2px solid var(--gold);  transform: translateX(100%); }

    .curtains.closed .curtain-left  { transform: translateX(0); }
    .curtains.closed .curtain-right { transform: translateX(0); }

    .curtains.open .curtain-left  { transform: translateX(-100%); }
    .curtains.open .curtain-right { transform: translateX(100%); }

    /* ============ DESKTOP ============ */
    @media (min-width: 768px) {
      .btn-group { flex-direction: row; max-width: 500px; gap: 1rem; }
      .btn-group .btn { flex: 1; }
      .logo-pos { margin-top: 40vh; }
    }

    @media (max-height: 700px) {
      .logo-pos { margin-top: 30vh; }
      .logo-stage { width: clamp(120px, 34vw, 190px); }
      .intro.stage-two .logo-pos { margin-top: 1.6rem; }
      .intro.stage-two .logo-stage { transform: scale(0.55); width: clamp(70px, 18vw, 105px); }
      .welcome { margin-top: .8rem; }
      .welcome-sub { margin: .5rem 0 1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>

  <div class="bg-decor" aria-hidden="true">
    <span class="star s1"></span>
    <span class="star s2"></span>
    <span class="star s3"></span>
    <span class="star s4"></span>
    <span class="star s5"></span>
  </div>

  <main class="intro" id="introScreen">
    <div class="logo-pos">
      <div class="logo-stage" id="logoStage">
        <div class="logo-wrap" id="logoWrap">
          <div class="logo-glow"></div>
          <img
            id="logoHikari"
            class="logo-img"
            src="assets/LogoIntro.png"
            alt="Logo Sanggar Tari Hikari"
            onerror="this.classList.add('logo-missing'); this.removeAttribute('src');"
          />
          <span class="logo-fallback">HIKARI</span>
        </div>
      </div>
    </div>

    <div class="welcome" id="welcomeBlock">
      <p class="eyebrow">SENI · GERAK · EKSPRESI</p>
      <h1 class="welcome-title">Selamat Datang di<br><span>Sanggar Hikari</span></h1>
      <p class="welcome-sub">Pilih pintu masuk Anda untuk melanjutkan.</p>

      <div class="btn-group">
        <button class="btn btn-gold" id="btnKlien">Masuk sebagai Klien</button>
        <button class="btn btn-outline" id="btnAdmin">Masuk sebagai Admin</button>
      </div>
    </div>
  </main>

  <div class="curtains" id="curtains" aria-hidden="true">
    <div class="curtain curtain-left"></div>
    <div class="curtain curtain-right"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const intro     = document.getElementById('introScreen');
      const logoWrap  = document.getElementById('logoWrap');
      const welcome   = document.getElementById('welcomeBlock');
      const btnKlien  = document.getElementById('btnKlien');
      const btnAdmin  = document.getElementById('btnAdmin');
      const curtains  = document.getElementById('curtains');

      /* ====== PENGATURAN WAKTU (FINAL: semua 1 detik) ====== */
      const LOADING_MS     = 1700;
      const WELCOME_DELAY  = 350;
      const FADE_MS        = 500;
      const CURTAIN_MS     = 1000;
      const HOLD_MS        = 1000;

      /* Tahap 2: logo mengecil & naik, lalu sapaan muncul */
      setTimeout(() => {
        intro.classList.add('stage-two');
        setTimeout(() => {
          welcome.classList.add('show');
        }, WELCOME_DELAY);
      }, LOADING_MS);

      /* ====== KLIEN: fade-out total (logo + sapaan) -> tirai MENUTUP -> diam -> tirai MEMBUKA -> home.html ====== */
      btnKlien.addEventListener('click', () => {
        btnKlien.disabled = true;
        btnAdmin.disabled = true;

        // 1) Fade-out sapaan
        welcome.classList.remove('show');
        welcome.style.pointerEvents = 'none';

        // 2) Fade-out logo + pendarnya via class .leaving (bersih, tanpa hapus sumber animasi)
        intro.classList.add('leaving');

        // 3) Setelah konten memudar, mainkan tirai
        setTimeout(() => {
          curtains.classList.add('active');
          void curtains.offsetWidth;
          requestAnimationFrame(() => {
            curtains.classList.add('closed'); // menutup (1s)
          });

          setTimeout(() => {
            curtains.classList.remove('closed');
            curtains.classList.add('open');   // membuka (1s)

            setTimeout(() => {
              window.location.href = 'home.html';
            }, CURTAIN_MS + 50);
          }, CURTAIN_MS + HOLD_MS);

        }, FADE_MS);
      });

      /* ====== ADMIN: langsung ke login.html ====== */
      btnAdmin.addEventListener('click', () => {
        btnAdmin.disabled = true;
        window.location.href = 'login.html';
      });
    });
  </script>
</body>
</html>
